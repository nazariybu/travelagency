# Extra Ansible modules
# (Containers in Proxmox are created by Terraform now, see terraform/README.md,
#  so community.proxmox is not needed any more.)
collections:
  - name: community.mysql     # MySQL database and users (app.yml)
  - name: community.docker    # run Jenkins in Docker (jenkins.yml)
  - name: ansible.posix       # SSH keys (jenkins.yml)
  - name: community.hashi_vault   # read secrets from HashiCorp Vault (group_vars/all.yml)
    version: ">=6.2.0,<7.0.0"