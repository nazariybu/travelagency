- name: Set up the nginx load balancer
  hosts: lb
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Remove the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Add the load balancer site
      ansible.builtin.template:
        src: nginx-lb.conf.j2
        dest: /etc/nginx/conf.d/travelagency.conf
        mode: "0644"
      notify: Reload nginx

    # Check the full config before the handler reloads nginx.
    # A failed check stops the play, so a broken config is never loaded.
    - name: Check the nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Make sure nginx is running and starts on boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
