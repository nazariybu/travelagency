- name: Create LXC containers in Proxmox
  hosts: localhost
  gather_facts: false
  vars:
    proxmox_token: "{{ lookup('ansible.builtin.env', 'PROXMOX_TOKEN_SECRET') }}"  # secret: comes from .env
    containers:
      - { vmid: 301, name: vm-app,     ip: 192.168.18.101 }
      - { vmid: 302, name: vm-db,      ip: 192.168.18.102 }
      - { vmid: 305, name: vm-app2,    ip: 192.168.18.105 }
      - { vmid: 306, name: vm-lb,      ip: 192.168.18.106, memory: 512 }
      - { vmid: 307, name: vm-redis,   ip: 192.168.18.107, memory: 512 }
      - { vmid: 303, name: vm-jenkins, ip: 192.168.18.103, cores: 1, memory: 2048, disk: 16, features: [nesting=1] }
      - { vmid: 304, name: vm-agent,   ip: 192.168.18.104, cores: 4, memory: 4096, disk: 32, features: [nesting=1] }      
      - { vmid: 308, name: vm-monitor, ip: 192.168.18.108, cores: 2, memory: 2048, disk: 16, features: [nesting=1] }
  tasks:
    - name: Create container
      community.proxmox.proxmox:
        api_host: 192.168.18.200        # IP вашого Proxmox
        api_user: ansible@pve
        api_token_id: ansible
        api_token_secret: "{{ proxmox_token }}"
        node: pve                      # назва вузла
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        ostemplate: local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst
        disk: "local-lvm:{{ item.disk | default(8) }}"
        cores: "{{ item.cores | default(1) }}"
        memory: "{{ item.memory | default(2048) }}"
        netif: '{"net0":"name=eth0,bridge=vmbr0,ip={{ item.ip }}/24,gw=192.168.18.1"}'
        pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
        unprivileged: true
        features: "{{ item.features | default(omit) }}"        
        state: present
        validate_certs: false
      loop: "{{ containers }}"

    - name: Start container
      community.proxmox.proxmox:
        api_host: 192.168.18.200
        api_user: ansible@pve
        api_token_id: ansible
        api_token_secret: "{{ proxmox_token }}"
        node: pve
        vmid: "{{ item.vmid }}"
        state: started
        validate_certs: false
      loop: "{{ containers }}"
      register: start_result
      until: start_result is succeeded
      retries: 10
      delay: 5