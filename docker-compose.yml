# Local stack: nginx -> Tomcat app -> MySQL + Redis
# Run:  docker compose up -d --build
# Secrets come from the .env file next to this file (see .env.example).

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: travelagency
      MYSQL_USER: travel
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  app:
    build: .
    image: ${DOCKERHUB_USER:-local}/travelagency:${APP_TAG:-latest}
    environment:
      DB_TRAVELAGENCY_URL: "jdbc:mysql://db:3306/travelagency?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
      DB_TRAVELAGENCY_USER: travel
      DB_TRAVELAGENCY_PASSWORD: ${DB_PASSWORD}
      REDIS_TRAVELAGENCY_HOST: redis
      REDIS_TRAVELAGENCY_PORT: "6379"
      REDIS_TRAVELAGENCY_PASSWORD: ${REDIS_PASSWORD}
    # No "ports": Tomcat is reachable only through nginx
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data: