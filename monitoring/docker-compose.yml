# Monitoring stack on vm-monitor: Prometheus + Grafana + Blackbox + Redis exporter
# Installed by:  ansible-playbook monitoring.yml   (copies this folder to /opt/monitoring)
# By hand:       docker compose up -d   (needs prometheus/prometheus.yml and .env, Ansible makes both)
# UI:            Grafana http://<vm-monitor>:3000   Prometheus http://<vm-monitor>:9090

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle          # allows reload: curl -X POST localhost:9090/-/reload
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Used only on the first start; later change the password in the UI
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # data source + dashboard list
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro    # dashboard JSON files
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Checks the site from outside, like a user: is it up, how fast, which HTTP code
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    expose:
      - "9115"
    restart: unless-stopped

  # Redis metrics. Runs here, not on vm-redis: it only needs the address and password
  redis-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: ${REDIS_ADDR:?set REDIS_ADDR in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    expose:
      - "9121"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
