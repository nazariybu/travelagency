# Reverse proxy: the browser talks only to nginx, Tomcat is not published outside
upstream travelagency {
    # "app" is the service name from docker-compose.yml (Docker DNS)
    server app:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    # Do not show the nginx version in errors and headers
    server_tokens off;
    client_max_body_size 10m;

    location / {
        proxy_pass http://travelagency;
        # Pass the real client info to Tomcat
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Simple check that nginx itself is alive
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}