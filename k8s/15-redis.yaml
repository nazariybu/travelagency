# Redis for the HTTP sessions, as a pod in the cluster (it was vm-redis / aws-redis before).
# Why here and not in AWS ElastiCache: ElastiCache with a password needs TLS, the app connects without TLS.
# No disk: if the Redis pod restarts, users log in again. For sessions that is fine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: travelagency
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1                      # one Redis: all app pods must see the SAME sessions
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  strategy:
    type: Recreate                 # never two Redis at the same time
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999             # user "redis" in the official image
        runAsGroup: 1000
        fsGroup: 1000              # /data belongs to this group, so Redis may write there
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          # The password comes from the same Secret the app uses. $(REDIS_PASSWORD) = Kubernetes puts
          # the value of the env variable below into the command line.
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""                   # no snapshots to disk
            - --appendonly
            - "no"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelagency-secrets
                  key: REDIS_TRAVELAGENCY_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}             # a temporary folder that lives as long as the pod
---
# "redis:6379" for the app pods. ClusterIP = only inside the cluster, never from the internet.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: travelagency
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis